<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LowerPropTax - Direct Mail Campaigns</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏡</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Clerk.js -->
    <script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_live_Y2xlcmsubG93ZXJwcm9wdGF4LmNvbSQ"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        type="text/javascript"
    ></script>
    <style>
        .stats-row {
            margin-bottom: 2rem;
        }

        .campaign-card {
            background: white;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .campaign-card:hover {
            border-color: #3171ef;
            box-shadow: 0 4px 12px rgba(49, 113, 239, 0.15);
            transform: translateY(-2px);
        }

        .campaign-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .campaign-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a1a1a;
        }

        .campaign-date {
            font-size: 0.85rem;
            color: #999;
        }

        .campaign-stats {
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
            color: #666;
        }

        .campaign-stat {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .campaign-stat strong {
            color: #1a1a1a;
        }

        .stat-paid {
            color: #27ae60;
        }

        /* New campaign form */
        .new-campaign-form {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 2rem;
        }

        .new-campaign-form h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 0.75rem;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            padding: 0.6rem 0.75rem;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: 'Inter', Arial, sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3171ef;
        }

        .btn-add {
            background: #3171ef;
            color: white;
            padding: 0.6rem 1.25rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', Arial, sans-serif;
            white-space: nowrap;
        }

        .btn-add:hover {
            background: #2560d9;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .campaign-stats {
                flex-wrap: wrap;
                gap: 1rem;
            }
        }
    </style>
</head>
<body class="bg-gray">
    <!-- Navigation -->
    <nav>
        <a href="/" class="logo-link"><div class="logo">🏡 LowerPropTax</div></a>
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="admin.html">Assessments</a></li>
                <li><a href="admin-campaigns.html" style="color: #3171ef;">Campaigns</a></li>
            </ul>
            <div class="user-info">
                <span class="user-name" id="user-name">Loading...</span>
                <div id="user-button"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="dashboard-mockup">
            <div class="mockup-header">
                <h2>Direct Mail Campaigns</h2>
            </div>

            <!-- New Campaign Form -->
            <div class="new-campaign-form">
                <h3>Create New Campaign</h3>
                <form id="new-campaign-form" class="form-row">
                    <div class="form-group">
                        <label for="campaign-name">Campaign Name</label>
                        <input type="text" id="campaign-name" placeholder="e.g. Aria Feb 2026" required>
                    </div>
                    <div class="form-group">
                        <label for="campaign-county">County</label>
                        <input type="text" id="campaign-county" placeholder="e.g. Fulton">
                    </div>
                    <div class="form-group">
                        <label for="campaign-state">State</label>
                        <input type="text" id="campaign-state" value="GA" placeholder="GA">
                    </div>
                    <div class="form-group">
                        <label for="campaign-deadline">Deadline</label>
                        <input type="date" id="campaign-deadline">
                    </div>
                    <button type="submit" class="btn-add">Create</button>
                </form>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card">
                    <label>Total Campaigns</label>
                    <div class="value" id="total-campaigns">0</div>
                </div>
                <div class="stat-card">
                    <label>Total Recipients</label>
                    <div class="value" id="total-recipients">0</div>
                </div>
            </div>

            <!-- Campaign List -->
            <div id="loading" class="loading">Loading campaigns...</div>
            <div id="empty-state" class="empty-state hidden">
                <h3>No campaigns yet</h3>
                <p>Create a campaign above to start adding direct mail recipients.</p>
            </div>
            <div id="campaigns-list" class="hidden"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://lowerproptax.up.railway.app/api';
        const isDevelopment = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

        async function getToken() {
            if (isDevelopment) return 'dev-token';
            return await window.Clerk.session.getToken();
        }

        async function loadCampaigns() {
            try {
                const token = await getToken();
                const response = await fetch(`${API_BASE}/admin/campaigns`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to load campaigns');

                const campaigns = await response.json();
                displayCampaigns(campaigns);
            } catch (error) {
                console.error('Error loading campaigns:', error);
                document.getElementById('loading').textContent = 'Failed to load campaigns.';
            }
        }

        function displayCampaigns(campaigns) {
            document.getElementById('loading').classList.add('hidden');

            if (campaigns.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                document.getElementById('total-campaigns').textContent = '0';
                document.getElementById('total-recipients').textContent = '0';
                return;
            }

            document.getElementById('campaigns-list').classList.remove('hidden');
            document.getElementById('total-campaigns').textContent = campaigns.length;

            let totalRecipients = 0;
            const list = document.getElementById('campaigns-list');
            list.innerHTML = '';

            campaigns.forEach(c => {
                const recipientCount = parseInt(c.recipientCount) || 0;
                const paidCount = parseInt(c.paidCount) || 0;
                const totalViews = parseInt(c.totalViews) || 0;
                totalRecipients += recipientCount;

                const card = document.createElement('a');
                card.href = `admin-campaign.html?id=${c.id}`;
                card.className = 'campaign-card';
                card.innerHTML = `
                    <div class="campaign-header">
                        <div class="campaign-name">${c.name}</div>
                        <div class="campaign-date">${new Date(c.createdAt).toLocaleDateString()}</div>
                    </div>
                    <div class="campaign-stats">
                        <div class="campaign-stat">
                            <span>Recipients:</span>
                            <strong>${recipientCount}</strong>
                        </div>
                        <div class="campaign-stat stat-paid">
                            <span>Paid:</span>
                            <strong>${paidCount}</strong>
                        </div>
                        <div class="campaign-stat">
                            <span>Page Views:</span>
                            <strong>${totalViews}</strong>
                        </div>
                        <div class="campaign-stat">
                            <span>County:</span>
                            <strong>${c.county || '--'}, ${c.state || '--'}</strong>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });

            document.getElementById('total-recipients').textContent = totalRecipients;
        }

        async function createCampaign(event) {
            event.preventDefault();

            const name = document.getElementById('campaign-name').value.trim();
            const county = document.getElementById('campaign-county').value.trim();
            const state = document.getElementById('campaign-state').value.trim();
            const deadline = document.getElementById('campaign-deadline').value;

            if (!name) {
                alert('Please enter a campaign name.');
                return;
            }

            try {
                const token = await getToken();
                const response = await fetch(`${API_BASE}/admin/campaigns`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, county, state, deadline: deadline || null })
                });

                if (!response.ok) throw new Error('Failed to create campaign');

                const campaign = await response.json();
                // Navigate to campaign detail page
                window.location.href = `admin-campaign.html?id=${campaign.id}`;
            } catch (error) {
                console.error('Error creating campaign:', error);
                alert('Failed to create campaign. Please try again.');
            }
        }

        document.getElementById('new-campaign-form').addEventListener('submit', createCampaign);

        // Initialize Clerk
        async function initClerk() {
            try {
                if (isDevelopment) {
                    document.getElementById('user-name').textContent = 'Developer';
                    document.getElementById('user-button').innerHTML = '<span style="color: #666;">Dev Mode</span>';
                    await loadCampaigns();
                    return;
                }

                await window.Clerk.load();
                if (!window.Clerk.user) {
                    window.location.href = '/';
                    return;
                }

                const user = window.Clerk.user;
                document.getElementById('user-name').textContent =
                    user.firstName || user.username || user.emailAddresses[0]?.emailAddress || 'User';
                window.Clerk.mountUserButton(document.getElementById('user-button'));

                await loadCampaigns();
            } catch (error) {
                console.error('Error initializing:', error);
                if (!isDevelopment) window.location.href = '/';
            }
        }

        window.addEventListener('load', async () => {
            if (window.Clerk) await initClerk();
            else document.addEventListener('clerk:loaded', initClerk);
        });
    </script>
</body>
</html>
