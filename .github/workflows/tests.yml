name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.21.1
      uses: actions/setup-node@v4
      with:
        node-version: '22.21.1'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Extract coverage percentage
      id: coverage
      run: |
        COVERAGE=$(node -e "const c = JSON.parse(require('fs').readFileSync('./coverage/coverage-summary.json', 'utf8')); console.log(c.total.lines.pct)")
        echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT

    - name: Generate coverage badge
      if: github.ref == 'refs/heads/main'
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: YOUR_GIST_ID
        filename: lowerproptax-coverage.json
        label: coverage
        message: "${{ steps.coverage.outputs.percentage }}%"
        valColorRange: ${{ steps.coverage.outputs.percentage }}
        minColorRange: 0
        maxColorRange: 100
